services:
  - type: web
    name: laura-nails-v2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: laura-nails-db
          property: connectionString
      - key: ADMIN_USER
        value: laura.laura
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: laura-nails-db
    databaseName: laura_nails
    user: laura_nails
