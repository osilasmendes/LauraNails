{% extends "base.html" %}
{% block title %}Complete seu cadastro | Laura Silva{% endblock %}
{% block content %}
<main class="auth-shell reverse">
    <div class="auth-photo" style="background-image:url('{{ url_for('static', filename='images/trabalho8.jpeg') }}')"></div>
    <div class="auth-panel">
        <h1>Complete seu cadastro</h1>
        <p>{{ dados.email }}</p>
        <form method="post" class="form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Nome<input name="nome" value="{{ dados.nome }}" autocomplete="name" maxlength="120" required></label>
            <label>WhatsApp com DDD<input type="tel" name="whatsapp" value="{{ whatsapp|default('') }}" autocomplete="tel" maxlength="40" required></label>
            <button class="btn primary wide" type="submit">Continuar</button>
        </form>
        <p class="helper">Já tem cadastro? <a href="{{ url_for('login') }}">Entre com sua senha</a> e vincule o Google no perfil.</p>
    </div>
</main>
{% endblock %}
